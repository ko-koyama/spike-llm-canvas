[project]
name = "spike-llm-canvas-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "awscrt>=0.36.2",
    "boto3>=1.43.86",
    "fastapi>=0.141.1",
    "strands-agents>=1.54.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "shapely>=2.1.2",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
