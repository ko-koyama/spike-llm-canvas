<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
      html, body, svg {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      svg {
        display: block;
        background: #f5f8fa;
      }
      .prefecture {
        /* fillはCSSでなくJS側のattr('fill', ...)で個別に決める。
           presentation属性はCSSより優先度が低く、ここでfillを指定すると上書きされてしまう */
        stroke: #fff;
        stroke-width: 0.5;
      }
      .flow-line {
        cursor: pointer;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        opacity: 0;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <svg id="map" viewBox="0 0 960 640"></svg>
    <div id="tooltip"></div>
    <script>
      const WIDTH = 960;
      const HEIGHT = 640;
      const geojson = {{prefectures_geojson}};
      const config = {{map_config}};

      const svg = d3.select('#map');
      const root = svg.append('g');
      const projection = d3.geoMercator().fitExtent(
        [[16, 16], [WIDTH - 16, HEIGHT - 16]],
        geojson
      );
      const path = d3.geoPath(projection);
      const valueByName = new Map(config.points.map((p) => [p.name, p.value]));

      svg.call(
        d3.zoom()
          .scaleExtent([1, 8])
          .on('zoom', (event) => root.attr('transform', event.transform))
      );

      const prefectureSel = drawPrefectures();
      if (config.mode === 'spider') {
        const lineSel = drawFlowLines();
        linkPolygonAndLineHover(prefectureSel, lineSel);
      }

      function drawPrefectures() {
        const colorScale = d3.scaleLinear()
          .domain([config.valueMin, config.valueMax])
          .range(['#bcd6ef', '#0081cf']);

        return root.selectAll('path.prefecture')
          .data(geojson.features)
          .join('path')
          .attr('class', 'prefecture')
          .attr('d', path)
          .attr('fill', (d) => {
            const value = valueByName.get(d.properties.name);
            if (config.mode !== 'choropleth' || value == null) return '#ccd6e2';
            return colorScale(value);
          })
          .on('mousemove', (event, d) => {
            const value = valueByName.get(d.properties.name);
            if (value != null) showTooltip(event, d.properties.name, value);
          })
          .on('mouseleave', hideTooltip);
      }

      function drawFlowLines() {
        const widthScale = d3.scaleLinear()
          .domain([config.valueMin, config.valueMax])
          .range([1, 12]);
        const origin = projection(config.origin);

        root.append('circle')
          .attr('cx', origin[0])
          .attr('cy', origin[1])
          .attr('r', 6)
          .attr('fill', '#e34948')
          .attr('stroke', '#fff')
          .attr('stroke-width', 1.5);

        return root.selectAll('line.flow-line')
          .data(config.points)
          .join('line')
          .attr('class', 'flow-line')
          .attr('x1', origin[0])
          .attr('y1', origin[1])
          .attr('x2', (d) => projection([d.lon, d.lat])[0])
          .attr('y2', (d) => projection([d.lon, d.lat])[1])
          .attr('stroke', '#eb6834')
          .attr('stroke-opacity', 0.6)
          .attr('stroke-width', (d) => widthScale(d.value))
          .on('mousemove', (event, d) => showTooltip(event, d.name, d.value))
          .on('mouseleave', hideTooltip);
      }

      // ポリゴンhoverと線hoverを連動させ、どちらをホバーしても同じ吹き出し・強調が出るようにする
      function linkPolygonAndLineHover(prefectureSel, lineSel) {
        prefectureSel
          .on('mouseenter.link', (event, d) => highlight(d.properties.name))
          .on('mouseleave.link', () => highlight(null));
        lineSel
          .on('mouseenter.link', (event, d) => highlight(d.name))
          .on('mouseleave.link', () => highlight(null));

        function highlight(name) {
          lineSel.attr('stroke-opacity', (d) => (name == null || d.name === name ? 0.6 : 0.1));
        }
      }

      function showTooltip(event, name, value) {
        const tooltip = document.getElementById('tooltip');
        tooltip.innerHTML = `<strong>${name}</strong>　${value}`;
        tooltip.style.opacity = 1;
        moveTooltip(event);
      }

      function moveTooltip(event) {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.left = event.clientX + 12 + 'px';
        tooltip.style.top = event.clientY + 12 + 'px';
      }

      function hideTooltip() {
        document.getElementById('tooltip').style.opacity = 0;
      }
    </script>
  </body>
</html>
